        <div class="rightside-row">

            +
          </div>
        </div>
      </div>

    <script>
      const nums = document.querySelectorAll(".num");
      const output = document.getElementById("output");
      const operators = document.querySelectorAll(".operator");
      const clearBtn = document.querySelector(".clear");

      let currHighlighted;
      let currenOperation = "";
      let lastNum = null;
      const currStack = [null, null, null];

      function insertNumber(number) {
        if (number == ".") {
          if (
            !output.innerText.includes(".") &&
            number == "." &&
            output.innerText != ""
          ) {
            output.innerText += number;
          }
        } else {
          if (output.innerText == "0") {
            output.innerText = number;
          } else {
            output.innerText += number;
          }
        }

        if (currStack[1] == null) {
          currStack[0] = output.innerText;
        } else {
          currStack[2] = output.innerText;
          lastNum = output.innerText;
        }

        console.log(currStack);

        currHighlighted
          ? (currHighlighted.style.backgroundColor = "#70ad47")
          : null;
      }

      function clearOutput(content) {
        output.innerText = content;
      }

      function performCalculation(firstNum, operator, secondNum) {
        console.log(firstNum, operator, secondNum);
        if (operator == "+") {
          currStack.push(firstNum + secondNum);
        } else if (operator == "-") {
          currStack.push(firstNum - secondNum);
        } else if (operator == "X") {
          currStack.push(firstNum * secondNum);
        } else if (operator == "\\") {
          currStack.push(firstNum / secondNum);
        }

        output.innerHTML = currStack[0];
        currStack.push(operator);
        currStack.push(null);
        console.log(currStack);
      }

      function checkStack() {
        console.log("checking stack...", currStack.length);
        if (currStack.length == 3 && currStack[2] != null) {
          firstNum = parseFloat(currStack.shift());
          operator = currStack.shift();
          secondNum = parseFloat(currStack.shift());
          performCalculation(firstNum, operator, secondNum);
        }
      }

      nums.forEach((num) => {
        num.addEventListener("click", function (event) {
          console.log("num clicked:", num);
          number = num.innerText;
          if (currenOperation == "") {
            insertNumber(number);
          } else {
            clearOutput("");
            insertNumber(number);
            currenOperation = "";
          }
        });
      });

      function runOperation(op, element) {
        currenOperation = op;
        console.log(currenOperation);

        if (currenOperation != "=") {
          checkStack();
          currStack[1] = currenOperation;
          if (currHighlighted) {
            currHighlighted.style.backgroundColor = "#70ad47";
          }
          currHighlighted = document.getElementById(element);
          currHighlighted.style.backgroundColor = "yellow";
        } else {
          if (
            currStack[0] != null &&

            dummyRemove = currStack.shift();

          } else {
            checkStack();
          }
        }

        console.log(currStack);
