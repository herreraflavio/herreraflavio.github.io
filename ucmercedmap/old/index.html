          function getPolygonCentroid(ring) {
            let signedArea = 0;
            let cx = 0;
            let cy = 0;

            if (
              ring.length > 0 &&
              (ring[0][0] !== ring[ring.length - 1][0] ||
                ring[0][1] !== ring[ring.length - 1][1])
            ) {
              ring.push([...ring[0]]);
            }

            for (let i = 0; i < ring.length - 1; i++) {
              const [x0, y0] = ring[i];
              const [x1, y1] = ring[i + 1];
              const cross = x0 * y1 - x1 * y0; // cross product
              signedArea += cross;
              cx += (x0 + x1) * cross;
              cy += (y0 + y1) * cross;
            }

            signedArea = signedArea / 2;
            cx = cx / (6 * signedArea);
            cy = cy / (6 * signedArea);

            return [cx, cy];
          }

          function buildNestedSidebarFromJson(features, container, sidebar) {
            // =============== 1) Build a nested tree from your features ===============

            const categoryTree = {};

            features.forEach((feature) => {
              // Use the category or fallback
              const categoryPath =
                feature.attributes?.category || "/Uncategorized/testing";
              const pathParts = categoryPath.split("/").filter(Boolean);

              // Build a unique key so we can reference the feature
              const uniqueKey = `${categoryPath}/${feature.attributes?.name}`;
              feature.uniqueKey = uniqueKey;

              // Walk through the categoryTree structure
              let currentNode = categoryTree;
              pathParts.forEach((part, index) => {
                if (!currentNode[part]) {
                  currentNode[part] = {};
                }
                if (index === pathParts.length - 1) {
                  // If this is the last part, place the feature in an "items" array
                  if (!currentNode[part].items) {
                    currentNode[part].items = [];
                  }
                  currentNode[part].items.push(feature);
                }
                currentNode = currentNode[part];
              });
            });

            // =============== 2) Keep a stack of where we are in the tree ===============

            // Start at the top-level node (Root)
            const pathStack = [{ nodeName: "Root", node: categoryTree }];

            // =============== 3) Render function: shows only the current node ===============

            function renderCurrentNode() {
              // Clear out the sidebar so we only show the current node's contents
              sidebar.innerHTML = "";

              // The current node is the top of the stack
              const currentEntry = pathStack[pathStack.length - 1];
              const currentNode = currentEntry.node;
              const currentName = currentEntry.nodeName;

              // --- Show a heading for the current node (optional) ---
              const headerDiv = document.createElement("div");
              headerDiv.style.fontWeight = "bold";
              headerDiv.style.marginBottom = "8px";
              headerDiv.textContent = `Current Category: ${currentName}`;
              sidebar.appendChild(headerDiv);

              // --- If not at the root, show a BACK button to go up one level ---
              if (pathStack.length > 1) {
                const backButton = document.createElement("button");
                backButton.textContent = "Back";
                backButton.style.marginBottom = "8px";
                backButton.addEventListener("click", () => {
                  // Go one level up
                  pathStack.pop();
                  renderCurrentNode();
                });
                sidebar.appendChild(backButton);
              }

              // --- 3A) Show subcategories (keys that are not 'items') ---
              Object.keys(currentNode).forEach((key) => {
                if (key === "items") return; // skip items

                // This is a subcategory, show a clickable row
                const catDiv = document.createElement("div");
                catDiv.className = "subcategory";
                catDiv.style.cursor = "pointer";
                catDiv.style.padding = "4px 0";
                catDiv.style.fontWeight = "500";
                catDiv.textContent = key;

                // Clicking on it drills down into that subcategory
                catDiv.addEventListener("click", () => {
                  pathStack.push({ nodeName: key, node: currentNode[key] });
                  renderCurrentNode();
                });

                sidebar.appendChild(catDiv);
              });

              // --- 3B) If there are items in this node, list them (features) ---
              if (currentNode.items && currentNode.items.length) {
                currentNode.items.forEach((feature) => {
                  const listItem = document.createElement("div");
                  listItem.className = "list-item";
                  listItem.style.display = "flex";
                  listItem.style.alignItems = "center";
                  listItem.style.cursor = "pointer";
                  listItem.style.marginLeft = "10px";
                  listItem.style.marginBottom = "4px";

                  // The feature's name
                  const nameDiv = document.createElement("div");
                  nameDiv.textContent = feature.attributes?.name || "Unnamed";
                  nameDiv.style.flexGrow = "1";

                  // The Hide/Show button
                  const toggleButton = document.createElement("button");
                  toggleButton.id = `toggle-${feature.uniqueKey}`;
                  toggleButton.style.marginLeft = "10px";
                  toggleButton.style.cursor = "pointer";
                  toggleButton.textContent =
                    feature.visible === false ? "Show" : "Hide";

                  // Toggle function
                  function toggleVisibility() {
                    const isVisible = feature.visible;
                    feature.visible = !isVisible;

                    // If there's a separate label graphic, toggle that too
                    const graphic = labelsLayer.graphics.find(
                      (g) =>
                        g.attributes.parentPath ===
                        `${feature.attributes.category}/${feature.attributes.name}`
                    );
                    if (graphic) {
                      graphic.visible = !graphic.visible;
                      toggleButton.textContent = graphic.visible
                        ? "Hide"
                        : "Show";
                      listItem.style.opacity = graphic.visible ? "1" : "0.5";
                    } else {
                      // If no separate label, just toggle the text & style
                      toggleButton.textContent = isVisible ? "Show" : "Hide";
                      listItem.style.opacity = isVisible ? "0.5" : "1";
                    }
                  }

                  // Click on the Hide/Show button => just toggle (prevent zoom)
                  toggleButton.addEventListener("click", (event) => {
                    event.stopPropagation();
                    toggleVisibility();
                  });

                  // Click on the list item => zoom to feature, highlight, open popup
                  listItem.addEventListener("click", () => {
                    // Clear highlight from any previously clicked item
                    document.querySelectorAll(".list-item").forEach((elem) => {
                      elem.style.backgroundColor = "white";
                    });
                    listItem.style.backgroundColor = "gray";

                    const isPoint = feature.geometry.type === "point";
                    const isPolygon = feature.geometry.type === "polygon";
                    const isLabel = feature.symbol?.type === "text";

                    // Adjust popup location slightly above the geometry
                    let popupLocation = isLabel
                      ? {
                          x: feature.geometry.x,
                          y: feature.geometry.y + 8,
                          spatialReference: { wkid: 3857 },
                        }
                      : isPoint
                      ? {
                          x: feature.geometry.x,
                          y: feature.geometry.y + 5,
                          spatialReference: { wkid: 3857 },
                        }
                      : feature.geometry.extent.center;

                    // Zoom and open popup
                    view
                      .goTo({
                        target: feature.geometry,
                        zoom: isLabel
                          ? 16
                          : isPoint
                          ? 19
                          : isPolygon
                          ? 17
                          : undefined,
                      })
                      .then(() => {
                        view.popup.location = popupLocation;
                        view.popup.open({
                          features: [feature],
                          location: popupLocation,
                        });
                      });
                  });

                  listItem.appendChild(nameDiv);
                  listItem.appendChild(toggleButton);
                  sidebar.appendChild(listItem);
                });
              }
            }

            // =============== 4) Render the ROOT level on initial load ===============
            renderCurrentNode();
          }

          //Function to toggle visibility (separate from buildSidebarList)
          function togglePolygonVisibility(id) {
            const graphic = polygonsLayer.graphics.find(
              (g) => g.attributes.id === id
            );
            if (!graphic) return;

            const isCurrentlyVisible = graphic.visible;
            graphic.visible = !isCurrentlyVisible; // Toggle visibility

            // Find and toggle label visibility
            const labelGraphic = labelsLayer.graphics.find(
              (g) => g.attributes.parentId === id
            );
            if (labelGraphic) {
              labelGraphic.visible = !isCurrentlyVisible;
            }

            // Update button text
            const button = document.getElementById(`toggle-btn-${id}`);
            if (button) {
              button.textContent = isCurrentlyVisible ? "Show" : "Hide";
            }

            // Update list item opacity for visual feedback
            const listItem = document.getElementById(`list-item-${id}`);
            if (listItem) {
              listItem.style.opacity = isCurrentlyVisible ? "0.5" : "1";
            }
          }

          // Function to build the sidebar (adds buttons with onclick events)
          function buildSidebarList(graphics, container) {
            graphics.forEach((graphic) => {
              const id = graphic.attributes.id;
              graphic.visible = true; // Start hidden

              // Create list item container
              const listItem = document.createElement("div");
              listItem.className = "list-item";
              listItem.id = `list-item-${id}`;

              // Feature name
              const nameDiv = document.createElement("div");
              nameDiv.textContent = graphic.attributes.name;
              nameDiv.style.flexGrow = "1";

              // Show/Hide button
              const toggleButton = document.createElement("button");
              toggleButton.id = `toggle-btn-${id}`;
              toggleButton.textContent = "Show"; // Starts as "Show"
              toggleButton.style.marginLeft = "10px";
              toggleButton.style.cursor = "pointer";

              // Correct way to assign onclick event
              toggleButton.onclick = () => togglePolygonVisibility(id);

              // Append elements
              listItem.appendChild(nameDiv);
              listItem.appendChild(toggleButton);
              container.appendChild(listItem);
            });
          }
