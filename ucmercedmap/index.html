                const properties = {

                const polygonGraphic = createPolygonGraphic(

                  fcIndex,

                  uniqueId,

                polygonsLayer.add(polygonGraphic);
                polygonGraphics.push(polygonGraphic);

                labelsLayer.add(labelGraphic);

          function hideGraphicById(graphicsLayer, graphicId) {
            const graphic = graphicsLayer.graphics.items.find(

            if (graphic) {

          function getPolygonCentroid(ring) {
            let signedArea = 0;
            let cx = 0;
            let cy = 0;

            if (
              ring.length > 0 &&
              (ring[0][0] !== ring[ring.length - 1][0] ||
                ring[0][1] !== ring[ring.length - 1][1])
            ) {
              ring.push([...ring[0]]);
            }

            for (let i = 0; i < ring.length - 1; i++) {
              const [x0, y0] = ring[i];
              const [x1, y1] = ring[i + 1];
              const cross = x0 * y1 - x1 * y0; // cross product
              signedArea += cross;
              cx += (x0 + x1) * cross;
              cy += (y0 + y1) * cross;
            }

            signedArea = signedArea / 2;
            cx = cx / (6 * signedArea);
            cy = cy / (6 * signedArea);

            return [cx, cy];
          }

          function createNameGraphic(ring, labelText, parentId) {
            const [cx, cy] = getPolygonCentroid(ring);
            return new Graphic({
              geometry: {
                type: "point",
                x: cx,
                y: cy,
                spatialReference: { wkid: 3857 },
              },
              attributes: {
                name: labelText || "labelText", // shown in sidebar
                description: "description",
                id: `label-${parentId}`, // Tie label to polygon
                parentId: parentId,
              },
              symbol: {
                type: "text", // Use a TextSymbol
                color: "black",
                haloColor: "white",
                haloSize: "2px",
                text: labelText || "labelText", // the actual text to display
                font: {
                  size: fontSize,
                  family: "sans-serif",
                  weight: "bold",
                },
              },
            });
          }

              symbol: {
                type: "simple-fill",
                color: color,

                      });
                  } else {

                  }

          }

          function createPointGraphic(coords, properties, fcIndex, fIndex) {
            return new Graphic({
              geometry: {
                type: "point",
                x: coords[0],
                y: coords[1],
                spatialReference: { wkid: 3857 },
              },
              attributes: {
                name:
                  properties.Name || `${properties.name} ${fcIndex}-${fIndex}`,
                description:
                  properties.Description || `FID: ${properties.FID || 0}`,

                content_url: properties.content_url || null, // Store content URL if available
              },
              symbol: {
                type: "picture-marker",
                url: properties.imgURL,
                width: "24px",
                height: "24px",
              },
              popupTemplate: {
                title: "{name}",
                content: (event) => {
                  const g = event.graphic;
                  let baseContent = `
          <p><b>Description:</b> ${g.attributes.description}</p>
          <p><i>Coordinates (Web Mercator):</i>
            [${g.geometry.x.toFixed(2)}, ${g.geometry.y.toFixed(2)}]
          </p>
        `;

                  if (g.attributes.content_url) {
                    // Fetch external HTML content
                    return fetch(g.attributes.content_url)
                      .then((res) => res.text())
                      .then((html) => {
                        return `<div class="popup-content">${html}</div>`;
                      })
                      .catch((err) => {
                        console.error("Error loading popup content:", err);
                        return (
                          baseContent +
                          `<p style="color:red;">Error loading additional details.</p>`
                        );
                      });
                  } else {
                    // No external content, return base content
                    return baseContent;
                  }
                },
              },
            });
          }

          function createLabelGraphic(coords, feature, fcIndex, fIndex) {
            const properties = feature.properties || {};
            const labelText = properties.Label || `Label ${fcIndex}-${fIndex}`;

            if (properties.display) {
              return new Graphic({
                geometry: {
                  type: "point",

                popupTemplate: {

                  <p><i>Label Coordinates (Web Mercator):</i>
                    [${g.geometry.x.toFixed(2)}, ${g.geometry.y.toFixed(2)}]
                  </p>
                `;
                  },
                },
              });
            }
          }

          // ----------------------------------------------------------------------
          // buildSidebarList: generic for polygons, points, or labels
          // ----------------------------------------------------------------------
          function buildSidebarList(graphics, container) {
            graphics.forEach((graphic) => {
              const listItem = document.createElement("div");
              listItem.className = "list-item";

              // Create a div for the feature name
              const nameDiv = document.createElement("div");
              nameDiv.textContent = graphic.attributes.name;
              nameDiv.style.flexGrow = "1";

              // Create the "Show/Hide" button
              const toggleButton = document.createElement("button");
              toggleButton.textContent = "Hide";
              toggleButton.style.marginLeft = "10px"; // Space between text and button
              toggleButton.style.cursor = "pointer";

              // Function to toggle visibility
              function toggleVisibility() {
                const isVisible = graphic.visible;
                graphic.visible = !isVisible; // Toggle visibility

                const labelGraphic = labelsLayer.graphics.find(
                  (g) => g.attributes.parentId === graphic.attributes.id
                );

                if (labelGraphic) {
                  labelGraphic.visible = !isVisible; // Toggle label visibility
                }

                // Update button text and style
                toggleButton.textContent = isVisible ? "Show" : "Hide";
                listItem.style.opacity = isVisible ? "0.5" : "1"; // Dim when hidden
              }

              // Toggle button event listener
              toggleButton.addEventListener("click", (event) => {
                event.stopPropagation(); // Prevent triggering the zoom on click

                toggleVisibility();
              });

              // Append the name and button to the list item
              listItem.appendChild(nameDiv);
              listItem.appendChild(toggleButton);

              listItem.addEventListener("click", () => {
                const isPoint = graphic.geometry.type === "point";
                const isPolygon = graphic.geometry.type === "polygon";
                const isLabel = graphic.symbol.type === "text"; // Detect labels

                nodeList = document.querySelectorAll(".list-item");
                for (let i = 0; i < nodeList.length; i++) {
                  nodeList[i].style.backgroundColor = "white";
                }
                listItem.style.backgroundColor = "gray";

                // Adjust popup location before opening
                let popupLocation = isLabel
                  ? {
                      x: graphic.geometry.x,
                      y: graphic.geometry.y + 8,
                      spatialReference: { wkid: 3857 },
                    } // Offset +8 for labels
                  : isPoint
                  ? {
                      x: graphic.geometry.x,
                      y: graphic.geometry.y + 5,
                      spatialReference: { wkid: 3857 },
                    } // Offset +5 for points
                  : graphic.geometry.extent.center; // No offset for polygons

                view
                  .goTo({
                    target: graphic.geometry,
                    zoom: isLabel
                      ? 16
                      : isPoint
                      ? 19
                      : isPolygon
                      ? 17
                      : undefined,
                  })
                  .then(() => {
                    view.popup.location = popupLocation; // Set location BEFORE opening the popup
                    view.popup.open({
                      features: [graphic],
                      location: popupLocation,
                    });
                  });
              });

              // Append the entire list item to the sidebar container
              container.appendChild(listItem);
            });
          }
        });
