<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Responsive Calendar (Two Spacers, CRN Inline, Expandable Events)
    </title>
    <style>
      /* Basic page styling */
      body {
        font-family: Arial, sans-serif;
        margin-left: 10px;
        margin-right: 5px;
        margin-top: 0px;
        margin-bottom: 0px;
        height: 100vh;
      }

      /* CRN input and error message */
      .crn-input-section {
        margin-bottom: 10px;
      }
      .error-message {
        color: red;
        font-size: 0.9em;
      }
      button {
        margin-top: 5px;
        padding: 6px 12px;
        cursor: pointer;
      }

      /* CRN list on a single line */
      .crn-list-container {
        height: 25px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 5px;
      }
      .crn-label {
        font-weight: bold;
      }
      #crnListItems {
        display: flex;
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .crn-item {
        background: #f3f3f3;
        padding: 4px 8px;
        border-radius: 4px;
      }

      /* MAIN CALENDAR LAYOUT */
      .calendar-wrapper {
        display: grid;
        grid-template-columns: 60px repeat(7, 1fr);
        column-gap: 1px;
        border: 1px solid #ccc;
        height: 80vh; /* responsive height: 80% of viewport */
        background-color: #fafafa;
      }

      /* TIME COLUMN */
      .time-column {
        position: relative;
        background-color: #f5f5f5;
        border-right: 1px solid #ccc;
        height: 100%;
      }
      .time-label {
        position: absolute;
        left: 0;
        width: 100%;
        text-align: right;
        padding-right: 5px;
        font-size: 0.85em;
        color: #666;
      }

      /* DAY COLUMN */
      .day-column {
        position: relative;
        border-left: 1px solid #ccc;
        background-color: #fff;
        height: 100%;
      }

      /* The top 5% is the day header.  */
      .day-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5%;
        background-color: #f2f2f2;
        text-align: center;
        font-weight: bold;
        border-bottom: 1px solid #ccc;
        line-height: 1.6;
      }

      /* The timeline-area from 5% to 100% of the column */
      .timeline-area {
        position: absolute;
        top: 5%;
        left: 0;
        right: 0;
        bottom: 0;
      }

      /* Each hour line is at top = "some %" within .timeline-area */
      .hour-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background-color: #eee;
      }

      /* EVENT ITEM */
      .event-item {
        position: absolute;
        left: 5%;
        width: 90%;
        border-radius: 4px;
        box-sizing: border-box;
        padding: 4px 6px;
        border: 1px solid #b3e0ff;
        cursor: pointer;
        transition: filter 0.2s ease;
        overflow: hidden; /* hide content until expanded */
      }
      .event-item:hover {
        /* slight dim to indicate clickable */
        filter: brightness(0.95);
      }
      /* When expanded, remove forced height & allow auto */
      .event-item.expanded {
        height: auto !important;
        z-index: 999;
        overflow: visible;
      }
      .event-time {
        font-size: 0.75em;
        color: #555;
        margin-bottom: 4px;
        font-weight: bold;
      }
      .event-title {
        margin-bottom: 2px;
      }

      /* Hidden details: shown when expanded */
      .event-details {
        font-size: 0.75em;
        color: #444;
        margin-top: 4px;
        display: none;
        white-space: pre-line;
      }
      .event-description {
        margin-bottom: 3px;
      }
      .event-alarm {
        font-style: italic;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div style="font-size: 35px; margin-bottom: 10px">
      Responsive Calendar (Two Spacers, CRN Inline, Expandable Events)
    </div>

    <!-- CRN input + error message -->
    <div class="crn-input-section">
      <span>Enter CRN:</span>
      <input type="text" id="crnInput" placeholder="5-digit CRN" />
      <button id="addButton">Add</button>
      <p id="errorMessage" class="error-message"></p>
    </div>

    <!-- CRN List on a single line -->
    <div class="crn-list-container">
      <span class="crn-label">CRN List:</span>
      <ul id="crnListItems"></ul>
    </div>

    <!-- Generate ICS button -->
    <button id="generateButton">Generate Calendar (.ics)</button>

    <!-- Main calendar container -->
    <div class="calendar-wrapper" id="calendarWrapper"></div>

    <script>
      // ---------------------------
      // CONFIG
      // ---------------------------
      const startHour = 7; // 7 AM
      const endHour = 22; // 10 PM
      const dayOrder = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
      ];

      // We'll place hour lines/events from 5% to 100% in the day columns => 95% timeline
      // For the time column, we place 2 spacers from 0..5% and 5..10%, then labels from 10..100%.
      const totalMinutes = (endHour - startHour) * 60;

      // Day columns: 5..100% => 95% for hours
      function getTopPercent(minOffset) {
        const fraction = minOffset / totalMinutes;
        return (5 + fraction * 95).toFixed(3) + "%";
      }
      function getHeightPercent(duration) {
        const fraction = duration / totalMinutes;
        return (fraction * 95).toFixed(3) + "%";
      }

      // Time column labels: 10..100 => 90% for hours (two 5% spacers)
      function getTimeColumnTopPercent(minOffset) {
        const fraction = minOffset / totalMinutes;
        return (10 + fraction * 90).toFixed(3) + "%";
      }

      // 12-hour format
      function formatHourLabel(h24) {
        const suffix = h24 >= 12 ? "PM" : "AM";
        let h12 = h24 % 12 || 12;
        return `${h12} ${suffix}`;
      }
      function formatTime12h(t24) {
        const [hh, mm] = t24.split(":").map(Number);
        const suffix = hh >= 12 ? "PM" : "AM";
        let h12 = hh % 12 || 12;
        return `${h12}:${String(mm).padStart(2, "0")} ${suffix}`;
      }

      // 12 random pastel colors
      // const eventColors = [
      //   "#e2f3ff",
      //   "#ffd9e2",
      //   "#d9ffe2",
      //   "#ffefcc",
      //   "#e8d9ff",
      //   "#fff9cc",
      //   "#d9fafa",
      //   "#fbdcfa",
      //   "#dce9fb",
      //   "#faf2dc",
      //   "#dceefb",
      //   "#fbe9dc",
      // ];

      // Example set of 12 vibrant, easily distinguishable colors
      const eventColors = [
        "rgba(255, 0, 0, 0.5)", // Red
        "rgba(0, 255, 0, 0.5)", // Green
        "rgba(0, 0, 255, 0.5)", // Blue
        "rgba(255, 255, 0, 0.5)", // Yellow
        "rgba(255, 0, 255, 0.5)", // Magenta
        "rgba(0, 255, 255, 0.5)", // Cyan
        "rgba(255, 127, 0, 0.5)", // Vivid Orange
        "rgba(127, 0, 255, 0.5)", // Vivid Purple
        "rgba(255, 0, 127, 0.5)", // Vivid Pink
        "rgba(127, 255, 0, 0.5)", // Lime
        "rgba(0, 127, 255, 0.5)", // Azure
        "rgba(255, 191, 0, 0.5)", // Amber
      ];

      // ---------------------------
      // DOM REFERENCES
      // ---------------------------
      const crnInput = document.getElementById("crnInput");
      const addButton = document.getElementById("addButton");
      const crnListItems = document.getElementById("crnListItems");
      const errorMessage = document.getElementById("errorMessage");
      const generateButton = document.getElementById("generateButton");
      const calendarWrapper = document.getElementById("calendarWrapper");

      // We'll store CRNs + events
      const crnList = [];
      const events = [];

      // ---------------------------
      // BUILD CALENDAR LAYOUT
      // ---------------------------
      function buildCalendarLayout() {
        // 1) TIME COLUMN
        const timeCol = document.createElement("div");
        timeCol.classList.add("time-column");
        calendarWrapper.appendChild(timeCol);

        // (A) Two spacers (each 5% of column)
        for (let s = 0; s < 2; s++) {
          const spaceDiv = document.createElement("div");
          spaceDiv.classList.add("time-label");
          spaceDiv.style.position = "absolute";
          spaceDiv.style.top = s * 5 + "%"; // 0% first, 5% second
          spaceDiv.style.height = "5%";
          spaceDiv.style.textAlign = "right";
          spaceDiv.style.color = "transparent"; // invisible placeholder
          timeCol.appendChild(spaceDiv);
        }

        // (B) Hour labels from 7 AM to 10 PM => 10..100%
        for (let h = startHour; h <= endHour; h++) {
          const minOff = (h - startHour) * 60;
          const topP = getTimeColumnTopPercent(minOff);

          const labelDiv = document.createElement("div");
          labelDiv.classList.add("time-label");
          labelDiv.style.position = "absolute";
          labelDiv.style.top = `calc(${topP} - 13px)`;
          labelDiv.innerText = formatHourLabel(h);

          timeCol.appendChild(labelDiv);
        }

        // 2) DAY COLUMNS
        dayOrder.forEach((day) => {
          const dayCol = document.createElement("div");
          dayCol.classList.add("day-column");
          dayCol.setAttribute("data-day", day);
          calendarWrapper.appendChild(dayCol);

          // day-header top 0..5%
          const header = document.createElement("div");
          header.classList.add("day-header");
          header.innerText = day;
          dayCol.appendChild(header);

          // timeline area (5..100%)
          const timelineArea = document.createElement("div");
          timelineArea.classList.add("timeline-area");
          dayCol.appendChild(timelineArea);

          // hour lines in day columns
          for (let hh = startHour; hh <= endHour; hh++) {
            const line = document.createElement("div");
            line.classList.add("hour-line");
            line.style.top = getTopPercent((hh - startHour) * 60);
            timelineArea.appendChild(line);
          }
        });
      }
      buildCalendarLayout();

      // Helper to get timeline area for a day
      function getTimelineArea(day) {
        const col = calendarWrapper.querySelector(
          `.day-column[data-day="${day}"]`
        );
        return col ? col.querySelector(".timeline-area") : null;
      }

      // ---------------------------
      // CRN LOGIC
      // ---------------------------
      function isValidCRN(crn) {
        return /^\d{5}$/.test(crn);
      }
      function addCRN() {
        const crnValue = crnInput.value.trim();
        if (!isValidCRN(crnValue)) {
          errorMessage.textContent = "CRN must be exactly 5 digits.";
          return;
        }
        errorMessage.textContent = "";
        crnList.push(Number(crnValue));

        // Show in UI
        const li = document.createElement("li");
        li.textContent = crnValue;
        li.classList.add("crn-item");
        crnListItems.appendChild(li);

        // Example term
        const term = "202510";
        addEvent(term, crnValue);

        crnInput.value = "";
      }
      addButton.addEventListener("click", addCRN);
      crnInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") addCRN();
      });
      crnInput.addEventListener("input", () => {
        const val = crnInput.value;
        if (/[^\d]/.test(val)) {
          errorMessage.textContent = "Only digits allowed.";
        } else if (val.length > 5) {
          errorMessage.textContent = "CRN must not exceed 5 digits.";
        } else if (val.length < 5 && val.length > 0) {
          errorMessage.textContent = "CRN must be 5 digits.";
        } else {
          errorMessage.textContent = "";
        }
      });

      // ---------------------------
      // RENDER EVENTS
      // ---------------------------
      function renderCalendar() {
        // remove old events
        document
          .querySelectorAll(".day-column .event-item")
          .forEach((el) => el.remove());

        events.forEach((evt) => {
          const {
            title,
            description,
            startTime,
            endTime,
            daysOfWeek,
            alarmMinutesBefore,
            bgColor,
          } = evt;

          const [sh, sm] = startTime.split(":").map(Number);
          const [eh, em] = endTime.split(":").map(Number);
          const startMin = (sh - startHour) * 60 + sm;
          const endMin = (eh - startHour) * 60 + em;
          const durationMin = endMin - startMin;

          const displayStart = formatTime12h(startTime);
          const displayEnd = formatTime12h(endTime);

          const topPercent = getTopPercent(startMin);
          const heightPercent = getHeightPercent(durationMin);

          daysOfWeek.forEach((day) => {
            const timelineArea = getTimelineArea(day);
            if (!timelineArea) return;

            const evDiv = document.createElement("div");
            evDiv.classList.add("event-item");
            evDiv.style.top = topPercent;
            evDiv.style.height = heightPercent;
            evDiv.style.backgroundColor = bgColor;

            const timeDiv = document.createElement("div");
            timeDiv.classList.add("event-time");
            timeDiv.textContent = `${displayStart} – ${displayEnd}`;

            const titleDiv = document.createElement("div");
            titleDiv.classList.add("event-title");
            titleDiv.textContent = title;

            const detailsDiv = document.createElement("div");
            detailsDiv.classList.add("event-details");

            const descPara = document.createElement("div");
            descPara.classList.add("event-description");
            descPara.textContent = description;

            const alarmPara = document.createElement("div");
            alarmPara.classList.add("event-alarm");
            alarmPara.textContent = `Alarm: ${alarmMinutesBefore} min before`;

            detailsDiv.appendChild(descPara);
            detailsDiv.appendChild(alarmPara);

            // expand/collapse on click
            evDiv.addEventListener("click", () => {
              if (evDiv.classList.contains("expanded")) {
                evDiv.classList.remove("expanded");
                detailsDiv.style.display = "none";
              } else {
                evDiv.classList.add("expanded");
                detailsDiv.style.display = "block";
              }
            });

            evDiv.appendChild(timeDiv);
            evDiv.appendChild(titleDiv);
            evDiv.appendChild(detailsDiv);

            timelineArea.appendChild(evDiv);
          });
        });
      }

      // ---------------------------
      // ICS GENERATION
      // ---------------------------
      const eventDetailsList = events;
      function generateUID(i) {
        return `${Date.now()}-event-${i}@yourdomain.com`;
      }
      function generateDTStamp() {
        return (
          new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z"
        );
      }
      function formatTimeForICS(t) {
        return t.replace(":", "") + "00";
      }
      function generateEvent(ed, i) {
        const {
          title,
          description,
          location,
          startTime,
          endTime,
          daysOfWeek,
          alarmMinutesBefore,
        } = ed;

        const baseDate = "20250122"; // example date for repeating rule
        const startDT = `${baseDate}T${formatTimeForICS(startTime)}`;
        const endDT = `${baseDate}T${formatTimeForICS(endTime)}`;

        // iCalendar day codes
        const rruleDays = daysOfWeek.map((d) => daysMap[d]).join(",");
        const alarmTrigger = `-PT${alarmMinutesBefore}M`;
        const uid = generateUID(i);
        const dtStamp = generateDTStamp();

        return [
          "BEGIN:VEVENT",
          `UID:${uid}`,
          `DTSTAMP:${dtStamp}`,
          `SUMMARY:${title}`,
          `DESCRIPTION:${description}`,
          `LOCATION:${location}`,
          `DTSTART:${startDT}`,
          `DTEND:${endDT}`,
          `RRULE:FREQ=WEEKLY;BYDAY=${rruleDays}`,
          "BEGIN:VALARM",
          `TRIGGER:${alarmTrigger}`,
          "ACTION:DISPLAY",
          `DESCRIPTION:Reminder for ${title}`,
          "END:VALARM",
          "END:VEVENT",
        ].join("\r\n");
      }
      function generateCalendarFile() {
        const allEvents = eventDetailsList.map(generateEvent).join("\r\n");
        const icsContent = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//Your Org//Your Product//EN",
          "CALSCALE:GREGORIAN",
          allEvents,
          "END:VCALENDAR",
        ].join("\r\n");

        const blob = new Blob([icsContent], {
          type: "text/calendar;charset=utf-8",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "calendar.ics";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
      generateButton.addEventListener("click", generateCalendarFile);

      // ---------------------------
      // API CALLS
      // ---------------------------
      const daysMap = {
        Sunday: "SU",
        Monday: "MO",
        Tuesday: "TU",
        Wednesday: "WE",
        Thursday: "TH",
        Friday: "FR",
        Saturday: "SA",
      };
      async function getCodeByDescription(desc) {
        const jsonUrl = "https://flavioherrera.com/subjects.json";
        try {
          const res = await fetch(jsonUrl);
          if (!res.ok)
            throw new Error(`Cannot fetch subjects: ${res.statusText}`);
          const data = await res.json();
          const found = data.find((item) => item.description === desc);
          return found ? found.code : null;
        } catch (err) {
          console.error("Error fetching subject code:", err);
          return null;
        }
      }

      async function getProfessorRatingByName(name) {
        const jsonUrl = "https://flavioherrera.com/rate_my_professor.json";
        try {
          const res = await fetch(jsonUrl);
          if (!res.ok)
            throw new Error(`Cannot fetch subjects: ${res.statusText}`);
          const data = await res.json();
          const found = data.find(
            (item) => `${item.node.fistName} ${item.node.lastName}` === name
          );
          return found ? found.name : null;
        } catch (err) {
          console.error("Error fetching subject code:", err);
          return null;
        }
      }
      async function fetchFacultyMeetingTimes(term, crn) {
        const url = `https://hackerflavio.com/api/facultyMeetingTimes?term=${term}&crn=${crn}`;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP error: ${res.status}`);
          return await res.json();
        } catch (err) {
          console.error("Error fetching times:", err);
          return null;
        }
      }
      async function fetchClassDetails(term, crn) {
        const url = "https://hackerflavio.com/api/classDetails";
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ term, crn }),
          });
          if (!res.ok) throw new Error(`HTTP error: ${res.status}`);
          return await res.json();
        } catch (err) {
          console.error("Error fetching details:", err);
          return null;
        }
      }

      // ---------------------------
      // ADD EVENT
      // ---------------------------
      async function addEvent(term, crn) {
        console.log("Fetching faculty meeting times...");
        const stObj1 = await fetchFacultyMeetingTimes(term, crn);
        if (!stObj1) return;

        console.log("Fetching class details...");
        const stObj2 = await fetchClassDetails(term, crn);
        if (!stObj2) return;

        let shortTitle;
        try {
          const code = await getCodeByDescription(stObj2.subject);
          if (code) {
            shortTitle = `${code} ${stObj2.courseNumber} ${stObj1.meetingType}`;
          }
        } catch (e) {
          console.error("Error subject code:", e);
        }

        let professorRating;
        try {
          const rating = await getProfessorRatingByName(stObj1.displayName);
          if (rating) {
            professorRating = `Rating: ${rating}`;
          }
        } catch (e) {
          console.error("Error subject code:", e);
        }
        console.log("testing");
        console.log(professorRating);

        // choose a random pastel color once
        const indexToRemove = Math.floor(Math.random() * eventColors.length);
        const randomColor = eventColors[indexToRemove];

        eventColors.splice(indexToRemove, 1);

        const eventObj = {
          title: shortTitle || "Class Title",
          description: `${stObj1.buildingDescription} | Room ${stObj1.room}<br>${stObj1.displayName}<br>${stObj1.emailAddress}`,
          location: "Main Campus",
          startTime: stObj1.beginTime
            ? stObj1.beginTime.slice(0, 2) + ":" + stObj1.beginTime.slice(2, 4)
            : "13:30",
          endTime: stObj1.endTime
            ? stObj1.endTime.slice(0, 2) + ":" + stObj1.endTime.slice(2, 4)
            : "14:45",
          daysOfWeek: stObj1.meetingTime.length
            ? stObj1.meetingTime
            : ["Monday", "Wednesday", "Friday"],
          alarmMinutesBefore: 30,
          bgColor: randomColor,
        };

        events.push(eventObj);
        console.log("Created Event:", eventObj);

        renderCalendar();
      }
    </script>
  </body>
</html>
