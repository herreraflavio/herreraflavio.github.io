<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Calendar with Expand-on-Click</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin-left: 10px;
        margin-right: 5px;
        margin-top: 0px;
        margin-bottom: 0px;
        height: 100vh;
      }
      h1 {
        margin-bottom: 15px;
      }

      /* CRN input section */
      .crn-input-section {
        margin-bottom: 10px;
      }
      .error-message {
        color: red;
        font-size: 0.9em;
      }
      button {
        margin-top: 5px;
        padding: 6px 12px;
        cursor: pointer;
      }

      /* CRN list on a single line */
      .crn-list {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .crn-label {
        font-weight: bold;
      }
      #crnListItems {
        display: flex;
        gap: 10px; /* spacing between CRNs */
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .crn-item {
        background: #f3f3f3;
        padding: 4px 8px;
        border-radius: 4px;
      }

      /*
         MAIN CALENDAR LAYOUT
         We'll use a grid:
           - 1 column for times (60px wide)
           - 7 columns for days (flexible width)
         We'll use a percentage-based height (80vh),
         so it grows/shrinks with the viewport.
      */
      .calendar-wrapper {
        display: grid;
        grid-template-columns: 60px repeat(7, 1fr);
        column-gap: 1px;
        border: 1px solid #ccc;

        /* Responsive "height": 80% of viewport, can adjust as needed */
        height: 80vh;
        /* overflow-y: auto; */
        background-color: #fafafa;
      }

      /* TIME COLUMN */
      .time-column {
        position: relative;
        background-color: #f5f5f5;
        border-right: 1px solid #ccc;
        height: 100%;
      }
      .time-label {
        position: absolute;
        left: 0;
        width: 100%;
        text-align: right;
        padding-right: 5px;
        font-size: 0.85em;
        color: #666;
      }

      /* DAY COLUMN */
      .day-column {
        position: relative;
        border-left: 1px solid #ccc;
        background-color: #fff;
        height: 100%;
      }

      /* The top ~5% is the day header. We place it absolutely at top:0. */
      .day-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5%; /* 5% of column's height for the header */
        background-color: #f2f2f2;
        text-align: center;
        font-weight: bold;
        border-bottom: 1px solid #ccc;
        line-height: 1.6;
      }

      /* The timeline-area from 5% to 100% of the column */
      .timeline-area {
        position: absolute;
        top: 5%;
        left: 0;
        right: 0;
        bottom: 0;
      }

      /* Each hour line is at top = "some %" within .timeline-area */
      .hour-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background-color: #eee;
      }

      /* EVENT ITEM */
      .event-item {
        position: absolute;
        left: 5%;
        width: 90%;
        border-radius: 4px;
        overflow: hidden;
        box-sizing: border-box;
        padding: 4px 6px;
        border: 1px solid #b3e0ff;
        cursor: pointer;
        transition: filter 0.2s ease;
        /* By default, we set an explicit height in percentages
           (based on start/end time). */
      }
      .event-item:hover {
        /* slight dim or lighten to show clickable */
        filter: brightness(0.95);
      }

      /* (\*) WHEN EXPANDED, we remove the forced height and allow auto. 
         We also give a higher z-index so it appears on top of any events below. */
      .event-item.expanded {
        height: auto !important; /* override the inline style that sets a percentage height */
        z-index: 999;
        overflow: visible; /* let the content be fully visible */
      }

      .event-time {
        font-size: 0.75em;
        color: #555;
        margin-bottom: 4px;
        font-weight: bold;
      }
      .event-title {
        margin-bottom: 2px;
      }

      /* Hidden details: Description + Alarm (toggle on click) */
      .event-details {
        font-size: 0.75em;
        color: #444;
        margin-top: 4px;
        white-space: pre-line;
        display: none; /* hidden by default, toggled on click */
      }
      .event-description {
        margin-bottom: 3px;
      }
      .event-alarm {
        font-style: italic;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div style="font-size: 35px">Responsive Calendar with Expand-on-Click</div>

    <!-- CRN input + error message -->
    <div class="crn-input-section">
      <span>Enter CRN:</span>
      <input type="text" id="crnInput" placeholder="5-digit CRN" />
      <button id="addButton">Add</button>
      <p id="errorMessage" class="error-message"></p>
    </div>

    <!-- CRN List (single-line) -->
    <div class="crn-list">
      <span class="crn-label">CRN List:</span>
      <ul id="crnListItems"></ul>
    </div>

    <!-- Generate ICS button -->
    <button id="generateButton">Generate Calendar (.ics)</button>

    <!-- Main calendar container -->
    <div class="calendar-wrapper" id="calendarWrapper"></div>

    <script>
      // ---------------------------
      // CONFIG
      // ---------------------------
      const startHour = 7; // 7 AM
      const endHour = 22; // 10 PM
      const dayOrder = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
      ];

      // We'll place hour lines and events from 5% to 100% of the day column.
      const totalMinutes = (endHour - startHour) * 60;

      // We have 5% used by the header, so timeline is 95% tall.
      function getTopPercent(minOffset) {
        const fraction = minOffset / totalMinutes; // 0..1
        return (5 + fraction * 95).toFixed(3) + "%"; // from 5%..100%
      }
      function getHeightPercent(duration) {
        const fraction = duration / totalMinutes;
        return (fraction * 95).toFixed(3) + "%";
      }

      // For 12-hour labels
      function formatHourLabel(h24) {
        const suffix = h24 >= 12 ? "PM" : "AM";
        let h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        return `${h12} ${suffix}`;
      }
      // Convert "13:30" -> "1:30 PM"
      function formatTime12h(time24) {
        const [hh, mm] = time24.split(":").map(Number);
        const suffix = hh >= 12 ? "PM" : "AM";
        let h12 = hh % 12;
        if (h12 === 0) h12 = 12;
        return `${h12}:${String(mm).padStart(2, "0")} ${suffix}`;
      }

      // 12 random pastel colors
      const eventColors = [
        "#e2f3ff",
        "#ffd9e2",
        "#d9ffe2",
        "#ffefcc",
        "#e8d9ff",
        "#fff9cc",
        "#d9fafa",
        "#fbdcfa",
        "#dce9fb",
        "#faf2dc",
        "#dceefb",
        "#fbe9dc",
      ];

      // ---------------------------
      // DOM REFS
      // ---------------------------
      const crnInput = document.getElementById("crnInput");
      const addButton = document.getElementById("addButton");
      const crnListItems = document.getElementById("crnListItems");
      const errorMessage = document.getElementById("errorMessage");
      const generateButton = document.getElementById("generateButton");
      const calendarWrapper = document.getElementById("calendarWrapper");

      // We'll store CRNs + events
      const crnList = [];
      const events = [];

      // ---------------------------
      // BUILD LAYOUT
      // ---------------------------
      function buildCalendarLayout() {
        // TIME COLUMN
        const timeCol = document.createElement("div");
        timeCol.classList.add("time-column");
        calendarWrapper.appendChild(timeCol);

        // First, create two spaces before the times
        for (let s = 0; s < 2; s++) {
          // Loop twice for two spaces
          const spaceDiv = document.createElement("div");
          spaceDiv.classList.add("time-label");
          // Add some height for the space (adjust as needed)
          spaceDiv.style.height = "20px"; // Space height
          spaceDiv.style.textAlign = "right"; // Keep the alignment consistent
          timeCol.appendChild(spaceDiv);
        }

        for (let h = startHour; h <= endHour; h++) {
          const minOff = (h - startHour) * 60;
          const topP = getTopPercent(minOff);

          const labelDiv = document.createElement("div");
          labelDiv.classList.add("time-label");
          // shift label up a bit
          labelDiv.style.top = `calc(${topP} - 8px)`;
          labelDiv.innerText = formatHourLabel(h);

          timeCol.appendChild(labelDiv);
        }

        // DAY COLUMNS
        dayOrder.forEach((day) => {
          const dayCol = document.createElement("div");
          dayCol.classList.add("day-column");
          dayCol.setAttribute("data-day", day);
          calendarWrapper.appendChild(dayCol);

          // header top 0..5%
          const header = document.createElement("div");
          header.classList.add("day-header");
          header.innerText = day;
          dayCol.appendChild(header);

          // timeline area
          const timelineArea = document.createElement("div");
          timelineArea.classList.add("timeline-area");
          dayCol.appendChild(timelineArea);

          // hour lines
          for (let hh = startHour; hh <= endHour; hh++) {
            const line = document.createElement("div");
            line.classList.add("hour-line");
            line.style.top = getTopPercent((hh - startHour) * 60);
            timelineArea.appendChild(line);
          }
        });
      }
      buildCalendarLayout();

      // Helper: get timeline area within a given day column
      function getTimelineArea(day) {
        const col = calendarWrapper.querySelector(
          `.day-column[data-day="${day}"]`
        );
        if (!col) return null;
        return col.querySelector(".timeline-area");
      }

      // ---------------------------
      // CRN LOGIC
      // ---------------------------
      function isValidCRN(crn) {
        return /^\d{5}$/.test(crn);
      }
      function addCRN() {
        const crnValue = crnInput.value.trim();
        if (!isValidCRN(crnValue)) {
          errorMessage.textContent = "CRN must be exactly 5 digits.";
          return;
        }
        errorMessage.textContent = "";
        crnList.push(Number(crnValue));

        // show in UI
        const li = document.createElement("li");
        li.textContent = crnValue;
        li.classList.add("crn-item");
        crnListItems.appendChild(li);

        // example term
        const term = "202510";
        addEvent(term, crnValue);

        crnInput.value = "";
      }

      addButton.addEventListener("click", addCRN);
      crnInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") addCRN();
      });
      crnInput.addEventListener("input", () => {
        const val = crnInput.value;
        if (/[^\d]/.test(val)) {
          errorMessage.textContent = "Only digits allowed.";
        } else if (val.length > 5) {
          errorMessage.textContent = "CRN must not exceed 5 digits.";
        } else if (val.length < 5 && val.length > 0) {
          errorMessage.textContent = "CRN must be 5 digits.";
        } else {
          errorMessage.textContent = "";
        }
      });

      // ---------------------------
      // RENDER EVENTS
      // ---------------------------
      function renderCalendar() {
        // remove old events
        document
          .querySelectorAll(".day-column .event-item")
          .forEach((el) => el.remove());

        events.forEach((evt) => {
          const {
            title,
            description,
            startTime,
            endTime,
            daysOfWeek,
            alarmMinutesBefore,
            bgColor,
          } = evt;

          const [sh, sm] = startTime.split(":").map(Number);
          const [eh, em] = endTime.split(":").map(Number);
          const startMin = (sh - startHour) * 60 + sm;
          const endMin = (eh - startHour) * 60 + em;
          const durationMin = endMin - startMin;

          const displayStart = formatTime12h(startTime);
          const displayEnd = formatTime12h(endTime);

          const topPercent = getTopPercent(startMin);
          const heightPercent = getHeightPercent(durationMin);

          daysOfWeek.forEach((day) => {
            const timelineArea = getTimelineArea(day);
            if (!timelineArea) return;

            // Build event container
            const evDiv = document.createElement("div");
            evDiv.classList.add("event-item");
            evDiv.style.top = topPercent;
            evDiv.style.height = heightPercent;
            evDiv.style.backgroundColor = bgColor;

            // Time block
            const timeDiv = document.createElement("div");
            timeDiv.classList.add("event-time");
            timeDiv.textContent = `${displayStart} – ${displayEnd}`;

            // Title
            const titleDiv = document.createElement("div");
            titleDiv.classList.add("event-title");
            titleDiv.textContent = title;

            // Hidden details
            const detailsDiv = document.createElement("div");
            detailsDiv.classList.add("event-details");

            const descPara = document.createElement("div");
            descPara.classList.add("event-description");
            descPara.textContent = description;

            const alarmPara = document.createElement("div");
            alarmPara.classList.add("event-alarm");
            alarmPara.textContent = `Alarm: ${alarmMinutesBefore} min before`;

            detailsDiv.appendChild(descPara);
            detailsDiv.appendChild(alarmPara);

            // (\*) Toggle expanded when clicked
            evDiv.addEventListener("click", () => {
              const isCurrentlyExpanded = evDiv.classList.contains("expanded");
              if (isCurrentlyExpanded) {
                // if expanded, collapse
                evDiv.classList.remove("expanded");
                detailsDiv.style.display = "none";
              } else {
                // if collapsed, expand
                evDiv.classList.add("expanded");
                detailsDiv.style.display = "block";
              }
            });

            // Append children
            evDiv.appendChild(timeDiv);
            evDiv.appendChild(titleDiv);
            evDiv.appendChild(detailsDiv);

            timelineArea.appendChild(evDiv);
          });
        });
      }

      // ---------------------------
      // ICS GENERATION
      // ---------------------------
      const eventDetailsList = events;
      function generateUID(i) {
        return `${Date.now()}-event-${i}@yourdomain.com`;
      }
      function generateDTStamp() {
        return (
          new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z"
        );
      }
      function formatTimeForICS(t) {
        return t.replace(":", "") + "00";
      }
      function generateEvent(ed, i) {
        const {
          title,
          description,
          location,
          startTime,
          endTime,
          daysOfWeek,
          alarmMinutesBefore,
        } = ed;
        const baseDate = "20250122"; // for repeating rule
        const startDT = `${baseDate}T${formatTimeForICS(startTime)}`;
        const endDT = `${baseDate}T${formatTimeForICS(endTime)}`;

        const rruleDays = daysOfWeek.map((d) => daysMap[d]).join(",");
        const alarmTrigger = `-PT${alarmMinutesBefore}M`;
        const uid = generateUID(i);
        const dtStamp = generateDTStamp();

        return [
          "BEGIN:VEVENT",
          `UID:${uid}`,
          `DTSTAMP:${dtStamp}`,
          `SUMMARY:${title}`,
          `DESCRIPTION:${description}`,
          `LOCATION:${location}`,
          `DTSTART:${startDT}`,
          `DTEND:${endDT}`,
          `RRULE:FREQ=WEEKLY;BYDAY=${rruleDays}`,
          "BEGIN:VALARM",
          `TRIGGER:${alarmTrigger}`,
          "ACTION:DISPLAY",
          `DESCRIPTION:Reminder for ${title}`,
          "END:VALARM",
          "END:VEVENT",
        ].join("\r\n");
      }
      function generateCalendarFile() {
        const allEvents = eventDetailsList.map(generateEvent).join("\r\n");

        const icsContent = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//Your Organization//Your Product//EN",
          "CALSCALE:GREGORIAN",
          allEvents,
          "END:VCALENDAR",
        ].join("\r\n");

        const blob = new Blob([icsContent], {
          type: "text/calendar;charset=utf-8",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "calendar.ics";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
      generateButton.addEventListener("click", generateCalendarFile);

      // ---------------------------
      // API CALLS (your Node server)
      // ---------------------------
      const daysMap = {
        Sunday: "SU",
        Monday: "MO",
        Tuesday: "TU",
        Wednesday: "WE",
        Thursday: "TH",
        Friday: "FR",
        Saturday: "SA",
      };
      async function getCodeByDescription(desc) {
        const jsonUrl = "https://flavioherrera.com/subjects.json";
        try {
          const res = await fetch(jsonUrl);
          if (!res.ok)
            throw new Error(`Cannot fetch subjects: ${res.statusText}`);
          const data = await res.json();
          const found = data.find((item) => item.description === desc);
          return found ? found.code : null;
        } catch (err) {
          console.error("Error fetching subject code:", err);
          return null;
        }
      }
      async function fetchFacultyMeetingTimes(term, crn) {
        const url = `https://hackerflavio.com/api/facultyMeetingTimes?term=${term}&crn=${crn}`;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP error: ${res.status}`);
          return await res.json();
        } catch (err) {
          console.error("Error fetching times:", err);
          return null;
        }
      }
      async function fetchClassDetails(term, crn) {
        const url = "https://hackerflavio.com/api/classDetails";
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ term, crn }),
          });
          if (!res.ok) throw new Error(`HTTP error: ${res.status}`);
          return await res.json();
        } catch (err) {
          console.error("Error fetching details:", err);
          return null;
        }
      }

      // ---------------------------
      // ADD EVENT
      // ---------------------------
      async function addEvent(term, crn) {
        console.log("Fetching faculty meeting times...");
        const stObj1 = await fetchFacultyMeetingTimes(term, crn);
        if (!stObj1) return;

        console.log("Fetching class details...");
        const stObj2 = await fetchClassDetails(term, crn);
        if (!stObj2) return;

        let shortTitle;
        try {
          const code = await getCodeByDescription(stObj2.subject);
          if (code) {
            shortTitle = `${code} ${stObj2.courseNumber} ${stObj1.meetingType}`;
          } else {
            console.log("No subject code match, fallback title.");
          }
        } catch (error) {
          console.error("Error subject code:", error);
        }

        // pick random color once
        const randomColor =
          eventColors[Math.floor(Math.random() * eventColors.length)];

        const eventObj = {
          title: shortTitle || "Class Title",
          description:
            `${stObj1.buildingDescription} | Room ${stObj1.room}\n` +
            `${stObj1.displayName}\n${stObj1.emailAddress}`,
          location: "Main Campus",
          startTime: stObj1.beginTime
            ? stObj1.beginTime.slice(0, 2) + ":" + stObj1.beginTime.slice(2, 4)
            : "13:30",
          endTime: stObj1.endTime
            ? stObj1.endTime.slice(0, 2) + ":" + stObj1.endTime.slice(2, 4)
            : "14:45",
          daysOfWeek: stObj1.meetingTime.length
            ? stObj1.meetingTime
            : ["Monday", "Wednesday", "Friday"],
          alarmMinutesBefore: 30,
          bgColor: randomColor,
        };

        events.push(eventObj);
        console.log("Created Event:", eventObj);

        renderCalendar();
      }
    </script>
  </body>
</html>
